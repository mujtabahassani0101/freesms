name: Native Windows verification
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      persist_evidence:
        description: Commit selected synthetic report previews and verification logs
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Verify native LocalDB and business workflows
        shell: pwsh
        run: |
          Get-ChildItem 'C:/Program Files/Microsoft SQL Server/*/Tools/Binn/SqlLocalDB.exe' | ForEach-Object { $_.FullName; & $_.FullName versions }
          dotnet run --project dotnet/FreeSms.Checks/FreeSms.Checks.csproj -c Release -- --root . --integration 2>&1 | Tee-Object -FilePath validation/windows-native-checks.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify original report calculations
        shell: pwsh
        run: |
          dotnet run --project dotnet/FreeSms.ReportChecks/FreeSms.ReportChecks.csproj -c Release -- . 2>&1 | Tee-Object validation/report-formulas-checks.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-verification
          path: |
            validation/windows-native-checks.log
            validation/report-formulas-checks.log
          retention-days: 7
  original:
    permissions:
      contents: write
    name: Native .NET 10 original application
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build all recovered original Windows code
        shell: pwsh
        run: ./scripts/build-original-windows.ps1
      - name: Verify native controls, 7 RPX layouts, 98 migrated and 2 rebuilt reports
        shell: pwsh
        run: |
          dotnet run --project dotnet/FreeSms.NativeChecks/FreeSms.NativeChecks.csproj -c Release -- . 2>&1 | Tee-Object validation/native-controls-checks.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native component diagnostics before database workflows
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-component-diagnostics
          path: |
            validation/native-controls-checks.log
            validation/native-controls/error.txt
            validation/native-controls/student-photos.png
            validation/native-controls/persian-*.png
            validation/native-controls/latin-*.png
          if-no-files-found: warn
      - name: Exercise original report preview action with an isolated database
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'dist/FreeSMS-Net10/FreeSMS.exe'
          $process = Start-Process $app -ArgumentList '--verify-report-actions' -PassThru
          if (-not $process.WaitForExit(300000)) { $process.Kill(); throw 'Report action verification timed out.' }
          Get-Content dist/FreeSMS-Net10/navigation-checks/report-actions-summary.log -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) {
            Get-Content dist/FreeSMS-Net10/navigation-checks/*_report_*.log -ErrorAction SilentlyContinue
            exit 1
          }
      - name: Exercise school, discount, backup, teacher, driver, payment, attendance, student registration and deletion workflows through original buttons
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'dist/FreeSMS-Net10/FreeSMS.exe'
          $process = Start-Process $app -ArgumentList '--verify-business-actions' -PassThru
          if (-not $process.WaitForExit(720000)) { $process.Kill(); throw 'Business action verification timed out.' }
          Get-Content dist/FreeSMS-Net10/navigation-checks/business-actions-summary.log -ErrorAction SilentlyContinue
          Get-Content dist/FreeSMS-Net10/navigation-checks/*_workflow_*.log -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { exit 1 }
      - name: Upload functional action diagnostics before remaining checks
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: original-functional-actions
          path: |
            dist/FreeSMS-Net10/navigation-checks/
            dist/FreeSMS-Net10/original-runtime-error.txt
          retention-days: 7
      - name: Verify the original forms and native controls
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'dist/FreeSMS-Net10/FreeSMS.exe'
          $process = Start-Process -FilePath $app -ArgumentList '--verify-original-forms' -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Original form verification timed out.' }
          if ($process.ExitCode -ne 0) {
            Get-Content dist/FreeSMS-Net10/original-runtime-error.txt -ErrorAction SilentlyContinue
            Get-Content dist/FreeSMS-Net10/original-forms-verification.txt -ErrorAction SilentlyContinue
            exit 1
          }
          Get-Content dist/FreeSMS-Net10/original-forms-verification.txt
      - name: Verify .NET 10 initialization and original login
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'dist/FreeSMS-Net10/FreeSMS.exe'
          $process = Start-Process $app -ArgumentList '--verify-native-startup' -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'Native startup timed out.' }
          if ($process.ExitCode -ne 0) { Get-Content dist/FreeSMS-Net10/original-runtime-error.txt; exit 1 }
          Get-Content dist/FreeSMS-Net10/native-startup-verification.txt
      - name: Verify main menu loading and responsiveness with an isolated database
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'dist/FreeSMS-Net10/FreeSMS.exe'
          $process = Start-Process $app -ArgumentList '--verify-navigation' -PassThru
          if (-not $process.WaitForExit(900000)) { $process.Kill(); throw 'Navigation verification timed out.' }
          Get-Content dist/FreeSMS-Net10/navigation-checks/summary.log -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { Get-Content dist/FreeSMS-Net10/original-runtime-error.txt -ErrorAction SilentlyContinue; exit 1 }
      - name: Upload original verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: original-windows-verification
          path: |
            dist/FreeSMS-Net10/*verification*.txt
            dist/FreeSMS-Net10/original-runtime-error.txt
            validation/native-controls-checks.log
            validation/dotnet-release.json
            validation/native-controls/
            dist/FreeSMS-Net10/navigation-checks/
            dist/FreeSMS-Net10/startup-*.png
            dist/FreeSMS-Net10/original-forms/
          retention-days: 7
      - name: Upload original application build
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: FreeSMS-Net10-Windows-x86
          path: dist/FreeSMS-Net10/
          retention-days: 7
      - name: Save selected review evidence when requested
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.persist_evidence }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force validation/previews | Out-Null
          Copy-Item dist/FreeSMS-Net10/original-forms/asdb3.png validation/previews/main.png -Force
          Copy-Item dist/FreeSMS-Net10/original-forms/asdk.png validation/previews/designer.png -Force
          foreach ($name in @('CR_AF_StdKarnameDorehByChart_term1.rpt','CrAvgClassBooks_1.rpt','CrListBooksRengMark2.rpt','CrRptStdBalance.rpt','long-subreport-last')) {
            Copy-Item "validation/native-controls/$name.png" validation/previews/ -Force
          }
          Copy-Item dist/FreeSMS-Net10/original-forms-verification.txt validation/net10-forms-verification.txt -Force
          Copy-Item dist/FreeSMS-Net10/native-startup-verification.txt validation/net10-startup-verification.txt -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/previews validation/net10-forms-verification.txt validation/net10-startup-verification.txt validation/native-controls-checks.log validation/dotnet-release.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'Record native Windows verification previews'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
