name: Native Windows verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatible:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build native compatible original application
        shell: pwsh
        run: ./scripts/build-native-compatible-windows.ps1
      - name: Install native Crystal runtime
        shell: pwsh
        run: |
          $installer = Join-Path $PWD 'vendor/runtime/CRRedist2005_x86.msi'
          $log = Join-Path $PWD 'validation/compatible-crystal-install.log'
          $process = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
          if ($process.ExitCode -notin @(0,3010)) { Get-Content $log -Tail 50; exit 1 }
      - name: Render all original forms using supported legacy controls
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'dist/FreeSMS-Native-Compatible/FreeSMS.exe'
          $process = Start-Process $app -ArgumentList '--verify-original-forms' -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'Compatible original form check timed out.' }
          Get-Content dist/FreeSMS-Native-Compatible/legacy-ui/original-forms-verification.txt -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { Get-Content dist/FreeSMS-Native-Compatible/legacy-ui/original-runtime-error.txt -ErrorAction SilentlyContinue; Get-Content dist/FreeSMS-Native-Compatible/native-launcher-error.txt -ErrorAction SilentlyContinue; exit 1 }
      - name: Verify native initialization and the original login
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'dist/FreeSMS-Native-Compatible/FreeSMS.exe'
          $process = Start-Process $app -ArgumentList '--verify-native-startup' -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'Native startup check timed out.' }
          if ($process.ExitCode -ne 0) { Get-Content dist/FreeSMS-Native-Compatible/legacy-ui/original-runtime-error.txt -ErrorAction SilentlyContinue; exit 1 }
          Get-Content dist/FreeSMS-Native-Compatible/legacy-ui/native-startup-verification.txt
      - name: Upload native compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: compatible-original-verification
          path: |
            dist/FreeSMS-Native-Compatible/legacy-ui/*verification.txt
            dist/FreeSMS-Native-Compatible/legacy-ui/original-runtime-error.txt
            dist/FreeSMS-Native-Compatible/legacy-ui/startup-*.png
            dist/FreeSMS-Native-Compatible/native-launcher-error.txt
            validation/compatible-crystal-install.log
      - name: Upload native compatibility build
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: FreeSMS-native-compatible-candidate
          path: dist/FreeSMS-Native-Compatible/
          retention-days: 7
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Verify native LocalDB and business workflows
        shell: pwsh
        run: |
          Get-ChildItem 'C:/Program Files/Microsoft SQL Server/*/Tools/Binn/SqlLocalDB.exe' | ForEach-Object { $_.FullName; & $_.FullName versions }
          dotnet run --project dotnet/FreeSms.Checks/FreeSms.Checks.csproj -c Release -- --root . --integration 2>&1 | Tee-Object -FilePath validation/windows-native-checks.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish self-contained Windows application
        shell: pwsh
        run: dotnet publish dotnet/FreeSms.Windows/FreeSms.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o dist/FreeSMS-Net10
      - name: Render every recovered form on Windows
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'dist/FreeSMS-Net10/FreeSMS.exe'
          $process = Start-Process -FilePath $app -ArgumentList '--verify-forms' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content dist/FreeSMS-Net10/forms-verification-error.txt -ErrorAction SilentlyContinue
            exit 1
          }
          Get-Content dist/FreeSMS-Net10/forms-verification.txt
      - name: Upload Windows verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-verification
          path: |
            validation/windows-native-checks.log
            dist/FreeSMS-Net10/forms-verification*.txt
          retention-days: 7
      - name: Upload native Windows application
        uses: actions/upload-artifact@v7.0.2
        with:
          name: FreeSMS-Net10-native-Windows-x64
          path: dist/FreeSMS-Net10/
          retention-days: 7
  original:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build all recovered original Windows code
        shell: pwsh
        run: ./scripts/build-original-windows.ps1
      - name: Verify the original forms and vendor controls
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'dist/FreeSMS-Original-Net10/school_Af.exe'
          $process = Start-Process -FilePath $app -ArgumentList '--verify-original-forms' -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Original form verification timed out.' }
          if ($process.ExitCode -ne 0) {
            Get-Content dist/FreeSMS-Original-Net10/original-runtime-error.txt -ErrorAction SilentlyContinue
            Get-Content dist/FreeSMS-Original-Net10/original-forms-verification.txt -ErrorAction SilentlyContinue
            exit 1
          }
          Get-Content dist/FreeSMS-Original-Net10/original-forms-verification.txt
      - name: Install native legacy reporting runtime
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $installer = Join-Path $PWD 'vendor/runtime/CRRedist2005_x86.msi'
          $log = Join-Path $PWD 'validation/crystal-install.log'
          $process = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
          if ($process.ExitCode -notin @(0,3010)) { Get-Content $log -Tail 50; exit 1 }
      - name: Verify every original report template in native runtime
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'dist/FreeSMS-Original-Net10/report-host/FreeSms.ReportHost.exe'
          $process = Start-Process $app -ArgumentList '--verify-engine' -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Report verification timed out.' }
          if ($process.ExitCode -ne 0) { Get-Content dist/FreeSMS-Original-Net10/report-host/error.txt -ErrorAction SilentlyContinue; exit 1 }
          Get-Content dist/FreeSMS-Original-Net10/report-host/report-engine-verification.txt
      - name: Upload original verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: original-windows-verification
          path: |
            dist/FreeSMS-Original-Net10/*verification*.txt
            dist/FreeSMS-Original-Net10/original-runtime-error.txt
            dist/FreeSMS-Original-Net10/report-host/*verification.txt
            dist/FreeSMS-Original-Net10/report-host/error.txt
            validation/crystal-install.log
          retention-days: 7
      - name: Upload original application build
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: FreeSMS-Original-Net10-Windows-x86-candidate
          path: dist/FreeSMS-Original-Net10/
          retention-days: 7
